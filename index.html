<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAT Raw Data Table</title>
<style>
  :root {
    --ink: #3d3d3d; --ink-strong: #252423; --muted: #787878;
    --line: #e2e6e8; --line-strong: #cfd6d9;
    --head: #f0f3f5; --stripe: #f5f5f5; --teal: #3894a3; --teal-dark: #10353f; --excel: #1d6f42;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; color: var(--ink);
               font-family: "Segoe UI", Segoe, Arial, sans-serif; font-size: 11px; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------------- toolbar ---------------- */
  #bar { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line-strong); background: #fff; flex: none; }
  #bar > * { flex: none; }
  #count { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #count b { color: var(--ink-strong); }
  #count .cap { color: #8a6116; }
  #spacer { flex: 1 1 8px; min-width: 0; }
  #status { flex: 0 1 auto; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xg { display: flex; align-items: center; gap: 6px; }
  #status.ok { color: #1d6f42; } #status.error { color: #b3261e; } #status.warn { color: #8a6116; }
  .srch { position: relative; }
  .srch input { width: 150px; height: 24px; padding: 0 8px 0 24px; border: 1px solid var(--line-strong); border-radius: 3px;
                font: inherit; color: var(--ink); background: #fff; }
  .srch svg { position: absolute; left: 6px; top: 5px; width: 13px; height: 13px; fill: var(--muted); pointer-events: none; }
  button { font: inherit; cursor: pointer; }
  .pg { display: flex; align-items: center; gap: 2px; }
  .pg button { width: 22px; height: 22px; border: 1px solid var(--line-strong); background: #fff; border-radius: 3px; color: var(--ink);
               line-height: 1; padding: 0; }
  .pg button:hover:not(:disabled) { background: var(--head); }
  .pg button:disabled { color: #c4c9cc; cursor: default; }
  .pg span { color: var(--muted); white-space: nowrap; padding: 0 4px; }
  select { height: 24px; border: 1px solid var(--line-strong); border-radius: 3px; font: inherit; color: var(--ink); background: #fff; }
  #xl { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px 0 9px; border: 0; border-radius: 3px;
        background: var(--excel); color: #fff; font-weight: 600; white-space: nowrap; }
  #xl:hover:not(:disabled) { background: #17603a; }
  #xl:disabled, #csv:disabled { opacity: .55; cursor: default; }
  #xl svg { width: 15px; height: 15px; fill: #fff; }
  #csv, #clear { height: 26px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 3px; background: #fff; color: var(--ink); }
  #csv:hover:not(:disabled), #clear:hover { background: var(--head); }
  #clear { height: 22px; padding: 0 8px; color: var(--muted); }
  label.chk { display: flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  label.chk input { margin: 0; }

  /* ---------------- table ---------------- */
  #scroll { flex: 1; overflow: auto; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  thead th { position: sticky; top: 0; z-index: 3; background: var(--head); color: var(--ink-strong); font-weight: 600;
             text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line);
             white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { background: #e7ecef; }
  thead th .arrow { color: var(--teal); margin-left: 4px; font-size: 9px; }
  thead tr.filters th { top: 27px; z-index: 2; background: #fff; padding: 3px 4px; border-bottom: 1px solid var(--line-strong); cursor: default; }
  thead tr.filters th:hover { background: #fff; }
  /* size='1' keeps the input's intrinsic width out of the column's max-content width; 100% then fills the column */
  thead tr.filters input[type=text] { width: 100%; min-width: 92px; height: 21px; padding: 0 5px; border: 1px solid var(--line-strong);
                                      border-radius: 2px; font: inherit; color: var(--ink); }
  thead tr.filters input[type=text]::placeholder { color: #a9b1b5; }
  tbody td { padding: 4px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
             white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { background: #e8f3f5; }
  /* the first column stays put while the other 20-odd scroll sideways */
  thead th:first-child { left: 0; z-index: 5; }
  thead tr.filters th:first-child { z-index: 4; }
  tbody td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; border-right: 1px solid var(--line-strong); }
  thead th:first-child { border-right: 1px solid var(--line-strong); }
  tbody tr:nth-child(even) td:first-child { background: var(--stripe); }
  tbody tr:hover td:first-child { background: #e8f3f5; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  #empty { padding: 22px; color: var(--muted); text-align: center; }

  /* date range slider inside the filter row */
  .rng { min-width: 128px; padding: 0 2px; }
  .rng .lbl { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; line-height: 11px; }
  .rng .track { position: relative; height: 14px; }
  .rng input[type=range] { position: absolute; left: 0; top: 3px; width: 100%; margin: 0; height: 8px; pointer-events: none;
                           z-index: 1; -webkit-appearance: none; appearance: none; background: none; }
  .rng .track::before { content: ''; position: absolute; left: 1px; right: 1px; top: 6px; height: 3px;
                        border-radius: 2px; background: var(--line-strong); }
  .rng input[type=range]::-webkit-slider-runnable-track { height: 3px; background: transparent; }
  .rng input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 11px; height: 11px; margin-top: -4px;
                                                 border-radius: 50%; background: var(--teal); border: 1px solid #fff; cursor: pointer; }
  .rng input[type=range]::-moz-range-thumb { pointer-events: auto; width: 11px; height: 11px; border-radius: 50%;
                                             background: var(--teal); border: 1px solid #fff; cursor: pointer; }
  .rng input[type=range]::-moz-range-track { height: 3px; background: transparent; }
</style>
</head>
<body>
  <div id="app">
    <div id="bar">
      <div id="count">&nbsp;</div>
      <button id="clear" title="Remove every filter and the search on this table" hidden>Clear filters</button>
      <div id="spacer"></div>
      <div id="status">Starting…</div>
      <label class="chk" title="How many work orders Tableau builds for browsing - the worst-aging ones first. The export is not limited by this.">Preview
        <select id="preview">
          <option value="1000">1,000</option>
          <option value="2500">2,500</option>
          <option value="5000">5,000</option>
          <option value="10000">10,000</option>
          <option value="10000000">All rows</option>
        </select>
      </label>
      <label class="chk" title="Export every row the dashboard filters return, not just the ones loaded above"><input id="all" type="checkbox" checked> All rows</label>
      <div class="pg">
        <button id="first" title="First page">&#124;&#9664;</button>
        <button id="prev" title="Previous page">&#9664;</button>
        <span id="pageinfo">–</span>
        <button id="next" title="Next page">&#9654;</button>
        <button id="last" title="Last page">&#9654;&#124;</button>
        <select id="size" title="Rows per page">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="srch">
        <svg viewBox="0 0 16 16"><path d="M11.2 10.2h-.6l-.2-.2a5 5 0 1 0-.5.5l.2.2v.6l3.8 3.8 1.1-1.1-3.8-3.8Zm-4.6 0a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
        <input id="search" type="text" placeholder="Search table" autocomplete="off">
      </div>
      <div class="xg">
        <button id="xl" title="Download as Excel with real dates and numbers">
          <svg viewBox="0 0 16 16"><path d="M9.5 1H3.2C2.5 1 2 1.6 2 2.2v11.6c0 .6.5 1.2 1.2 1.2h9.6c.7 0 1.2-.6 1.2-1.2V5.5L9.5 1Zm2.2 12.5H4.3V9.2h7.4v4.3Zm0-5.5H4.3V6.7h7.4V8ZM9.2 5.2V2.3l3 3h-3Z"/></svg>
          Excel
        </button>
        <button id="csv" title="Comma-separated file – lighter for very large exports">CSV</button>
      </div>
    </div>
    <div id="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table><div id="empty" style="display:none"></div></div>
  </div>
  <script src="lib/tableau.extensions.1.17.0.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
