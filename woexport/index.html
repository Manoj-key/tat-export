<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WO Volume Raw Data Table</title>
<style>
  :root {
    --ink: #1d2b33; --ink2: #3d4a52; --muted: #6b7a84; --faint: #9aa7b0;
    --line: #e3e8ec; --line2: #cfd7dd; --head: #f3f6f8; --stripe: #f8fafb; --hover: #e8f3f5;
    --teal: #0097a9; --teal-dk: #0a7f8f; --indigo: #2f4b9b; --amber: #c9841a; --plum: #7a5195;
    --crimson: #c8102e; --good: #1d6f42; --warn: #8a6116; --bad: #b3261e;
    --primary: #0097a9; --primary-dk: #0a7f8f; --primary-fg: #ffffff;
    --tile: #f5f8fa; --tile-bd: #e3e8ec;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#fff; color:var(--ink);
               font-family:"Segoe UI", Segoe, Arial, sans-serif; font-size:12px; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; position:relative; }
  button { font:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  [hidden] { display:none !important; }

  /* ---------------- chips row ---------------- */
  #chips { display:flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-bottom:1px solid var(--line); flex:none; overflow:hidden; }
  #chips .ico { color:var(--faint); font-size:13px; margin-right:2px; flex:none; }
  #chiplist { display:flex; align-items:center; gap:6px; flex:0 1 auto; min-width:0; overflow:hidden; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px 0 9px; border-radius:11px; background:var(--head);
          border:1px solid var(--line2); font-size:10.5px; color:var(--ink2); white-space:nowrap; flex:none; }
  .chip b { font-weight:600; color:var(--ink); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .chip .x { color:var(--faint); font-size:13px; line-height:1; border:0; background:none; padding:0 0 1px; }
  .chip .x:hover { color:var(--bad); }
  .chip.info { border-style:dashed; }
  #chips .none { font-size:10.5px; color:var(--faint); }
  #clear { margin-left:4px; font-size:10.5px; color:var(--teal-dk); text-decoration:underline; text-underline-offset:2px; border:0; background:none; padding:0; flex:none; }
  #asof { margin-left:auto; font-size:10px; color:var(--muted); white-space:nowrap; flex:none; }
  #asof b { color:var(--ink2); font-weight:600; }

  /* ---------------- toolbar ---------------- */
  #bar { display:flex; align-items:center; gap:8px; height:42px; padding:0 10px; border-bottom:1px solid var(--line2); flex:none; }
  #count { font-size:11px; color:var(--muted); white-space:nowrap; }
  #count b { color:var(--ink); font-weight:600; }
  #count .sort { color:var(--faint); margin-left:8px; }
  #status { flex:0 1 auto; min-width:0; font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status.ok { color:var(--good); } #status.error { color:var(--bad); } #status.warn { color:var(--warn); }
  #bar .sp { flex:1 1 8px; min-width:0; }
  .ctl { height:26px; display:inline-flex; align-items:center; gap:6px; padding:0 9px; border:1px solid var(--line2); border-radius:4px; background:#fff; font-size:11px; color:var(--ink2); white-space:nowrap; }
  .ctl:hover:not(:disabled) { background:var(--head); }
  .ctl b { font-weight:600; color:var(--ink); }
  .ctl .caret { width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--faint); }
  .ctl.icon { width:26px; padding:0; justify-content:center; }
  .ctl.icon:disabled { color:#c4c9cc; }
  select.ctl { padding:0 6px; -webkit-appearance:none; appearance:none; }
  .lab { font-size:11px; color:var(--muted); white-space:nowrap; }
  .pg { display:inline-flex; align-items:center; gap:3px; }
  .pg .info { font-size:11px; color:var(--muted); padding:0 6px; white-space:nowrap; }
  .srch { position:relative; }
  .srch input { height:26px; width:160px; padding:0 8px 0 26px; border:1px solid var(--line2); border-radius:4px; font:inherit; font-size:11px; color:var(--ink); background:#fff; }
  .srch input::placeholder { color:var(--faint); }
  .srch svg { position:absolute; left:8px; top:7px; width:12px; height:12px; fill:var(--faint); pointer-events:none; }
  .btn { height:28px; display:inline-flex; align-items:center; gap:7px; padding:0 13px; border-radius:4px; border:0; font:inherit; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .btn.primary { background:var(--primary); color:var(--primary-fg); }
  .btn.primary:hover:not(:disabled) { background:var(--primary-dk); }
  .btn.primary:disabled { opacity:.55; }
  .btn.primary .caret { border-top-color:rgba(255,255,255,.85); }
  .btn svg { width:13px; height:13px; fill:#fff; }
  .btn.ghost { background:#fff; border:1px solid var(--line2); color:var(--ink2); font-weight:500; }

  /* ---------------- insight band ---------------- */
  #ins { flex:none; border-bottom:1px solid var(--line2); padding:8px 10px 10px; background:#fff; }
  #ins .sum { font-size:11px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:10px; min-height:14px; }
  #ins .sum b { color:var(--ink); font-weight:600; }
  #ins .sum span.t { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #instoggle { margin-left:auto; color:var(--teal-dk); font-size:10px; border:0; background:none; padding:0; white-space:nowrap; flex:none; }
  #ins .row { display:flex; gap:8px; align-items:stretch; }
  .tile { width:118px; flex:none; background:var(--tile); border:1px solid var(--tile-bd); border-radius:6px; padding:7px 10px 6px; min-width:0; }
  .tile .l { font-size:9.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .v { font-size:19px; font-weight:600; color:var(--ink); line-height:24px; letter-spacing:-.01em; white-space:nowrap; }
  .tile .v small { font-size:10px; font-weight:400; color:var(--muted); margin-left:4px; }
  .tile .d { font-size:9.5px; color:var(--muted); margin-top:1px; line-height:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .split { height:6px; border-radius:3px; overflow:hidden; display:flex; margin-top:5px; gap:2px; }
  .split i { display:block; height:100%; }
  .mini { flex:1 1 0; background:var(--tile); border:1px solid var(--tile-bd); border-radius:6px; padding:7px 10px 6px; min-width:0; position:relative; }
  .mini .l { font-size:9.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cols { display:flex; align-items:flex-end; gap:6px; height:40px; margin-top:6px; }
  .cols i { flex:1; display:block; background:var(--teal); border-radius:3px 3px 0 0; position:relative; min-width:4px; }
  .cols i.cur { background:var(--indigo); }
  .cols i.lbl::after { content:attr(data-v); position:absolute; top:-12px; left:-20px; right:-20px; text-align:center; font-size:8.5px; color:var(--muted); font-style:normal; }
  .xl { display:flex; gap:6px; margin-top:2px; }
  .xl span { flex:1; text-align:center; font-size:8px; color:var(--faint); white-space:nowrap; overflow:hidden; }
  .hb { margin-top:5px; }
  .hb div { display:flex; align-items:center; gap:6px; height:12px; font-size:9px; color:var(--ink2); margin-bottom:2px; }
  .hb div em { width:60px; flex:none; font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hb div i { display:block; height:7px; border-radius:0 3px 3px 0; background:var(--teal); min-width:3px; }
  .hb div i.alt { background:var(--indigo); }
  .hb div s { text-decoration:none; color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto; white-space:nowrap; }
  .tip { position:absolute; background:#1d2b33; color:#fff; font-size:10px; padding:4px 8px; border-radius:4px; pointer-events:none; z-index:40; white-space:nowrap; transform:translate(-50%, -100%); margin-top:-6px; }

  /* ---------------- table ---------------- */
  #scroll { flex:1; overflow:auto; position:relative; }
  table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  thead th { position:sticky; top:0; z-index:3; background:var(--head); color:var(--ink); font-weight:600; text-align:left; padding:0 10px; height:28px;
             border-bottom:1px solid var(--line2); border-right:1px solid var(--line); white-space:nowrap; font-size:11px; cursor:pointer; user-select:none; }
  thead th:hover { background:#e9eef1; }
  thead th .arrow { color:var(--teal-dk); margin-left:4px; font-size:9px; }
  thead th .q { display:inline-block; width:11px; height:11px; border-radius:50%; border:1px solid var(--line2); color:var(--faint); font-size:8px; line-height:9px; text-align:center; margin-left:5px; vertical-align:1px; }
  thead tr.filters th { top:28px; z-index:2; background:#fff; height:30px; padding:0 5px; border-bottom:1px solid var(--line2); cursor:default; }
  thead tr.filters th:hover { background:#fff; }
  thead tr.filters input[type=text] { width:100%; min-width:92px; height:20px; padding:0 6px; border:1px solid var(--line2); border-radius:3px; font:inherit; font-size:10px; color:var(--ink); }
  thead tr.filters input[type=text]::placeholder { color:var(--faint); }
  thead tr.filters input[type=text].on { border-color:var(--teal); }
  tbody td { padding:0 10px; height:27px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); white-space:nowrap; max-width:240px; overflow:hidden; text-overflow:ellipsis; font-size:11px; color:var(--ink2); }
  tbody tr:nth-child(even) td { background:var(--stripe); }
  tbody tr:hover td { background:var(--hover); }
  thead th:first-child { left:0; z-index:5; border-right:1px solid var(--line2); }
  thead tr.filters th:first-child { z-index:4; }
  tbody td:first-child { position:sticky; left:0; z-index:1; background:#fff; border-right:1px solid var(--line2); color:var(--ink); font-weight:500; }
  tbody tr:nth-child(even) td:first-child { background:var(--stripe); }
  tbody tr:hover td:first-child { background:var(--hover); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td .tag { display:inline-block; padding:1px 6px; border-radius:9px; font-size:9.5px; font-weight:600; }
  td .tag.a { background:#e3f4f6; color:var(--teal-dk); } td .tag.b { background:#e9ecf7; color:var(--indigo); }
  td .tag.rev { background:#fdf1dc; color:var(--warn); }
  .skel td i { display:block; height:10px; border-radius:3px; background:linear-gradient(90deg,#eef1f3,#f7f9fa,#eef1f3); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { from { background-position:200% 0 } to { background-position:-200% 0 } }
  .rng { position:relative; height:20px; min-width:128px; }
  .rng .lb { display:flex; justify-content:space-between; font-size:8px; color:var(--muted); line-height:9px; }
  .rng .tr { position:relative; height:12px; }
  .rng input[type=range] { position:absolute; left:0; top:2px; width:100%; margin:0; height:8px; pointer-events:none; z-index:1; -webkit-appearance:none; appearance:none; background:none; }
  .rng .tr::before { content:''; position:absolute; left:1px; right:1px; top:5px; height:3px; border-radius:2px; background:var(--line2); }
  .rng input[type=range]::-webkit-slider-runnable-track { height:3px; background:transparent; }
  .rng input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:11px; height:11px; margin-top:-4px; border-radius:50%; background:var(--teal); border:1px solid #fff; cursor:pointer; }
  .rng input[type=range]::-moz-range-thumb { pointer-events:auto; width:11px; height:11px; border-radius:50%; background:var(--teal); border:1px solid #fff; cursor:pointer; }
  .rng input[type=range]::-moz-range-track { height:3px; background:transparent; }

  #empty { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:#fff; }
  #empty .big { font-size:15px; font-weight:600; color:var(--ink); }
  #empty .why { font-size:11px; color:var(--muted); max-width:460px; text-align:center; line-height:16px; }
  #foot { flex:none; height:22px; border-top:1px solid var(--line); display:flex; align-items:center; padding:0 10px; font-size:9.5px; color:var(--faint); gap:14px; white-space:nowrap; overflow:hidden; }
  #foot b { color:var(--muted); font-weight:500; }
  #foot .r { margin-left:auto; }

  /* ---------------- popovers / toast ---------------- */
  .pop { position:absolute; background:#fff; border:1px solid var(--line2); border-radius:8px; box-shadow:0 10px 30px rgba(14,48,58,.18); z-index:20; font-size:11px; }
  .pop h4 { margin:0 0 10px; font-size:12.5px; font-weight:600; color:var(--ink); }
  .pop h4 span { font-weight:400; color:var(--muted); }
  #export { right:10px; top:80px; width:392px; padding:14px 16px 14px; }
  .opt { display:flex; align-items:center; gap:8px; min-height:24px; color:var(--ink2); cursor:pointer; }
  .opt input { margin:0; accent-color:var(--teal); }
  .opt .sub { color:var(--faint); margin-left:auto; font-size:10px; white-space:nowrap; }
  .grp { margin:6px 0 4px; font-size:9.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase; }
  .file { margin-top:10px; padding:8px 10px; background:var(--head); border-radius:5px; font-size:10.5px; color:var(--ink2); line-height:15px; }
  .file b { color:var(--ink); font-weight:600; word-break:break-all; }
  .file .m { color:var(--muted); font-size:10px; }
  .file .m.warn { color:var(--warn); }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .actions .cancel { margin-left:auto; color:var(--muted); border:0; background:none; }
  .prog { margin-top:10px; }
  .prog .t { display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink2); }
  .prog .bar { height:6px; border-radius:3px; background:var(--line); margin-top:5px; overflow:hidden; }
  .prog .bar i { display:block; height:100%; width:0; background:var(--teal); transition:width .2s; }
  #colpick { right:300px; top:80px; width:420px; padding:12px 14px; }
  #colpick input.s { width:100%; height:24px; border:1px solid var(--line2); border-radius:4px; padding:0 8px; font:inherit; font-size:10.5px; margin-bottom:8px; }
  #colpick .list { columns:2; column-gap:14px; max-height:330px; overflow:auto; }
  #colpick .opt { height:22px; break-inside:avoid; white-space:nowrap; overflow:hidden; }
  #colpick .opt .h { color:#c4c9cc; margin-right:2px; letter-spacing:-2px; cursor:grab; }
  #colpick .opt .nm { overflow:hidden; text-overflow:ellipsis; }
  #colpick .opt.drag { opacity:.4; }
  #colpick .ft { display:flex; gap:12px; margin-top:8px; font-size:10.5px; }
  #colpick .ft button { border:0; background:none; color:var(--teal-dk); padding:0; font:inherit; font-size:10.5px; }
  #colpick .ft .hint { margin-left:auto; color:var(--faint); }
  #toast { position:absolute; left:50%; bottom:32px; transform:translateX(-50%); background:#1d2b33; color:#fff; padding:8px 14px; border-radius:6px; font-size:11px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:30; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast b { color:#7ee1ec; }
  #hosting { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#fff; color:var(--muted); font-size:12px; z-index:50; }
</style>
</head>
<body>
<div id="app">
  <div id="chips">
    <span class="ico">&#9776;</span>
    <div id="chiplist"><span class="none">Loading filters…</span></div>
    <button id="clear" hidden>Clear all</button>
    <span id="asof"></span>
  </div>
  <div id="bar">
    <span id="count">&nbsp;</span>
    <span class="lab">Load</span>
    <select id="preview" class="ctl" title="How many rows are loaded into this page for browsing. The download is not limited by this.">
      <option value="1000">1,000</option><option value="2500">2,500</option><option value="5000">5,000</option><option value="10000">10,000</option><option value="10000000">All rows</option>
    </select>
    <span id="status"></span>
    <span class="sp"></span>
    <span class="pg">
      <button id="first" class="ctl icon" title="First page">|&#9664;</button>
      <button id="prev" class="ctl icon" title="Previous page">&#9664;</button>
      <span id="pageinfo" class="info">–</span>
      <button id="next" class="ctl icon" title="Next page">&#9654;</button>
      <button id="last" class="ctl icon" title="Last page">&#9654;|</button>
      <select id="size" class="ctl" title="Rows per page"><option value="50">50</option><option value="100" selected>100</option><option value="250">250</option><option value="500">500</option></select>
    </span>
    <button id="colbtn" class="ctl" title="Choose and order the columns">Columns <b id="colcount"></b><span class="caret"></span></button>
    <span class="srch"><svg viewBox="0 0 16 16"><path d="M11.2 10.2h-.6l-.2-.2a5 5 0 1 0-.5.5l.2.2v.6l3.8 3.8 1.1-1.1-3.8-3.8Zm-4.6 0a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg><input id="search" type="text" placeholder="Search this table" autocomplete="off"></span>
    <button id="dl" class="btn primary" title="Download as Excel or CSV"><svg viewBox="0 0 16 16"><path d="M8 1v8.6l2.9-2.9 1.1 1.1L8 11.7 4 7.8l1.1-1.1L8 9.6V1h0ZM2 13h12v1.6H2z"/></svg><span id="dllabel">Download</span><span class="caret"></span></button>
  </div>
  <div id="ins">
    <div class="sum"><span class="t" id="summary"></span><button id="instoggle">Hide insights ▲</button></div>
    <div class="row" id="insrow"></div>
  </div>
  <div id="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <div id="foot"><span id="foottip"><b>Tip</b> click a column heading to sort · type in the boxes to filter this table · the download honours every filter and the sort</span><span class="r" id="footr"></span></div>
  <div id="toast" hidden></div>
  <div id="hosting">Hosting OK - this table only works inside the Tableau dashboard</div>
</div>
<script src="lib/tableau.extensions.1.17.0.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
